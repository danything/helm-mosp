# デフォルトはTraefik固有のIngressRouteを使わず、クラスタ非依存で
# そのまま `helm install` できる状態にしてある。外部公開する場合は
# ingress.* を環境に合わせて上書きすること。

image:
  repository: ghcr.io/danything/mosp
  tag: latest
  pullPolicy: IfNotPresent

timezone: Asia/Tokyo

service:
  port: 8080

postgresql:
  image:
    repository: postgres
    # MosPの動作環境として案内されているPostgreSQL 13系に固定している
    # (https://www.e-s-mind.com/environment/)。Renovateにも13系以外へは
    # 上げさせない設定を入れてあるので、上げる場合はrenovate.jsonも直すこと。
    tag: "13"
  # DBコンテナを初期化するスーパユーザ。MosPの初回セットアップウィザードは
  # このユーザでDBに接続してデータベースとロールを作るため、ウィザード側の
  # 設定(setup.xmlのSuperUserName)にも同じ値を渡している。
  superuser: mosp
  # セットアップウィザードが作成し、以後MosPがDB接続に使うロール。
  # sql/grant.sql の権限付与先(usermosp)はウィザードがこの名前に置換する。
  # superuserと同じ名前にするとウィザードのDROP ROLEが自分自身を消せずに
  # 失敗するため、別の名前にしておくこと。
  user: usermosp
  database: mospv4
  # スーパユーザとMosP用ロールの双方にこのパスワードを使う。
  # 空ならチャートがパスワードを自動生成してSecretを作成する
  # (helm upgrade時もSecretの既存値を引き継ぐので毎回変わらない)。
  # 既存のSecret(例: 外部でkubesealしたSealedSecretの復号結果)を
  # 使いたい場合はここに名前とキーを指定する。
  existingSecret: ""
  existingSecretKey: db-password

persistence:
  # 空ならクラスタのデフォルトStorageClassを使う
  storageClassName: ""
  db:
    size: 5Gi
  logs:
    enabled: true
    size: 1Gi

resources: {}

# mospコンテナに追加で渡す環境変数
extraEnv: []
# - name: MOSP_DB_DRIVER
#   value: org.postgresql.Driver

ingress:
  enabled: false
  # 現状Traefik IngressRoute CRD専用。他のIngress Controllerを使う場合は
  # templates/ingress.yaml を書き換えること。
  host: mosp.example.com
  entryPoints:
    - websecure
  # 空ならtlsブロック自体を出力しない
  certResolver: ""
  # 例: [{name: forward-auth, namespace: auth}]
  middlewares: []
