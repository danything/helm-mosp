{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "mosp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosp.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  {{- with .Values.ingress.certResolver }}
  tls:
    certResolver: {{ . }}
  {{- end }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "mosp.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
