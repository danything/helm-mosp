apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosp.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosp.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mosp.labels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "mosp.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: {{ .Values.timezone }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.superuser }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mosp.dbSecretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "mosp.fullname" . }}-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mosp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mosp.labels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "mosp.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: mosp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone }}
            - name: MOSP_DB_URL
              value: "jdbc:postgresql://{{ include "mosp.fullname" . }}-db:5432/{{ .Values.postgresql.database }}"
            - name: MOSP_DB_USER
              value: {{ .Values.postgresql.user }}
            - name: MOSP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mosp.dbSecretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            # 初回セットアップウィザードがDBとロールを作るときに使う接続情報
            # (MosPのデフォルトはlocalhostのpostgres固定で、そのままでは
            # このチャートが立てたDBに接続できない)。
            - name: MOSP_DB_SUPERUSER
              value: {{ .Values.postgresql.superuser }}
            - name: MOSP_DB_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mosp.dbSecretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8080
          {{- if .Values.persistence.logs.enabled }}
          volumeMounts:
            - name: logs
              mountPath: /usr/local/tomcat/webapps/ROOT/logs
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.persistence.logs.enabled }}
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ include "mosp.fullname" . }}-logs
      {{- end }}
