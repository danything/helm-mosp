name: Build and Push MosP Image

on:
  schedule:
    # 毎月1日 03:00 JST (= 前月末日 18:00 UTC) に MosP の最新コードを確認してビルド
    # (MosP本体の更新頻度は年1回程度のため、高頻度のチェックは不要)
    - cron: "0 18 1 * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: mosp-image-build
  cancel-in-progress: false

env:
  MOSP_REPO_URL: https://github.com/es-mind/MosP.git
  MOSP_BRANCH: master
  REGISTRY: ghcr.io
  IMAGE_NAME: mosp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Resolve latest MosP commit
        id: mosp
        run: |
          sha=$(git ls-remote "${MOSP_REPO_URL}" "refs/heads/${MOSP_BRANCH}" | cut -f1)
          if [ -z "$sha" ]; then
            echo "Failed to resolve latest commit for ${MOSP_BRANCH}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ビルド済み判定はMosPのコミットSHAだけを見るため、イメージの作り方
      # (Dockerfile/entrypoint)を変えた場合は同じSHAでも作り直す必要がある。
      # 定期実行のときだけスキップ判定を行い、手動実行とビルド定義の変更時は
      # 常にビルドする。
      - name: Check if this MosP commit was already built
        id: check
        if: github.event_name == 'schedule'
        run: |
          image="${{ steps.image.outputs.name }}:${{ steps.mosp.outputs.short_sha }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "MosP commit ${{ steps.mosp.outputs.sha }} は既に $image としてビルド済みです。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            MOSP_REPO_URL=${{ env.MOSP_REPO_URL }}
            MOSP_REF=${{ steps.mosp.outputs.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.mosp.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
