apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosp.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mosp.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mosp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mosp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
