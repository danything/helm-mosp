# DBパスワードをクラスタのSealed Secretsコントローラの公開鍵で暗号化したもの。
# このリポジトリからは実際の値を生成できないため、下記はプレースホルダ。
# クラスタに対して以下を実行し、出力されたencryptedDataで置き換えること。
#
#   kubectl create secret generic mosp-secrets \
#     --namespace mosp \
#     --from-literal=db-password='<任意の強いパスワード>' \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml
#
# (kubeseal未導入の場合は https://github.com/bitnami-labs/sealed-secrets を参照)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mosp-secrets
  namespace: mosp
spec:
  encryptedData:
    db-password: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: mosp-secrets
      namespace: mosp
    type: Opaque
